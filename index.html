<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Aakash Kainthla | Filmmaker</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 42%,
      #17172f 0%,
      #080812 40%,
      #020208 80%
    );
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

#scene{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
}

#scene canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
  cursor:grab;
}

#scene canvas:active{
  cursor:grabbing;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:2;
  background:
    radial-gradient(
      circle,
      transparent 35%,
      rgba(0,0,0,.45) 100%
    );
}

.info{
  position:fixed;
  left:0;
  bottom:9%;
  width:100%;
  text-align:center;
  z-index:5;
  pointer-events:none;
  padding:0 18px;
}

h1{
  margin:0;
  font-size:clamp(30px,8vw,78px);
  font-weight:700;
  letter-spacing:5px;
  text-transform:uppercase;

  background:
    linear-gradient(
      120deg,
      #ffffff,
      #aaaabd,
      #ffffff
    );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.line{
  width:65px;
  height:1px;
  background:#888;
  margin:18px auto;
  opacity:.6;
}

.role{
  color:#a0a0b0;
  font-size:12px;
  letter-spacing:5px;
}

.quote{
  margin-top:10px;
  color:#666678;
  font-size:11px;
  letter-spacing:2px;
}

.hint{
  position:fixed;
  top:4%;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  color:#77778a;
  font-size:9px;
  letter-spacing:3px;
  pointer-events:none;
}

@media(max-width:600px){

  .info{
    bottom:8%;
  }

  h1{
    font-size:32px;
    letter-spacing:3px;
    white-space:nowrap;
  }

  .role{
    font-size:10px;
    letter-spacing:3px;
  }

  .quote{
    font-size:9px;
  }

}

</style>

</head>

<body>

<div id="scene"></div>

<div class="hint">
DRAG TO ROTATE
</div>

<div class="info">

<h1>AAKASH KAINTHLA</h1>

<div class="line"></div>

<div class="role">
FILMMAKER • WEB DEVELOPER
</div>

<div class="quote">
Stories • Visuals • Technology
</div>

</div>

<script type="module">

import * as THREE from
"https://esm.sh/three@0.180.0";

import { GLTFLoader } from
"https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";

const scene =
new THREE.Scene();

const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth /
window.innerHeight,
0.1,
1000
);

camera.position.set(
0,
0,
5
);

const renderer =
new THREE.WebGLRenderer({
antialias:true,
alpha:true
});

renderer.setPixelRatio(
Math.min(
window.devicePixelRatio,
2
)
);

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.outputColorSpace =
THREE.SRGBColorSpace;

renderer.domElement.style.touchAction =
"none";

document
.getElementById("scene")
.appendChild(
renderer.domElement
);

const ambientLight =
new THREE.AmbientLight(
0xffffff,
2
);

scene.add(ambientLight);

const keyLight =
new THREE.DirectionalLight(
0xffffff,
4
);

keyLight.position.set(
3,
5,
5
);

scene.add(keyLight);

const rimLight =
new THREE.PointLight(
0x5555ff,
18,
20
);

rimLight.position.set(
-3,
2,
4
);

scene.add(rimLight);

let model = null;

let rotationY = 0.3;

let rotationX = 0;

let dragging = false;

let lastX = 0;

let lastY = 0;

let velocityY = 0;

const loader =
new GLTFLoader();

loader.load(

"model_1787980875490.glb",

function(gltf){

model = gltf.scene;

const box =
new THREE.Box3()
.setFromObject(model);

const size =
box.getSize(
new THREE.Vector3()
);

const center =
box.getCenter(
new THREE.Vector3()
);

model.position.sub(center);

const maxSize =
Math.max(
size.x,
size.y,
size.z
);

const scale =
2.6 / maxSize;

model.scale.setScalar(scale);

model.rotation.y =
rotationY;

scene.add(model);

console.log(
"3D MODEL LOADED"
);

},

undefined,

function(error){

console.error(
"GLB ERROR:",
error
);

}

);
  /* =========================
   TOUCH / MOUSE CONTROL
========================= */

renderer.domElement.addEventListener(
  "pointerdown",
  function(event){

    dragging = true;

    lastX = event.clientX;
    lastY = event.clientY;

    velocityY = 0;

    renderer.domElement.setPointerCapture(
      event.pointerId
    );

  }
);


renderer.domElement.addEventListener(
  "pointermove",
  function(event){

    if(!dragging || !model) return;

    const dx =
      event.clientX - lastX;

    const dy =
      event.clientY - lastY;


    /* LEFT / RIGHT ROTATION */

    rotationY += dx * 0.012;


    /* UP / DOWN TILT */

    rotationX += dy * 0.006;


    rotationX =
      Math.max(
        -0.45,
        Math.min(0.45, rotationX)
      );


    /* MOMENTUM */

    velocityY =
      dx * 0.002;


    lastX = event.clientX;
    lastY = event.clientY;

  }
);


renderer.domElement.addEventListener(
  "pointerup",
  function(event){

    dragging = false;

    try{

      renderer.domElement.releasePointerCapture(
        event.pointerId
      );

    }catch(e){}

  }
);


renderer.domElement.addEventListener(
  "pointercancel",
  function(){

    dragging = false;

  }
);


/* =========================
   ANIMATION
========================= */

const clock =
new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );

  const time =
    clock.getElapsedTime();


  if(model){

    /* AUTO ROTATION */

    if(!dragging){

      rotationY += 0.002;

      rotationY += velocityY;

      velocityY *= 0.94;

    }


    /* SMOOTH ROTATION */

    model.rotation.y +=
      (
        rotationY -
        model.rotation.y
      ) * 0.12;


    model.rotation.x +=
      (
        rotationX -
        model.rotation.x
      ) * 0.12;


    /* FLOATING */

    model.position.y =
      Math.sin(time * 1.2) * 0.04;

  }


  renderer.render(
    scene,
    camera
  );

}


animate();


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  function(){

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>

</html>
