<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aakash Kainthla | Filmmaker</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#020208;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* COSMIC BACKGROUND */

body{
  background:
    radial-gradient(circle at 50% 45%,#17172d 0%,#080812 35%,#020208 75%);
}

/* 3D AREA */

#scene{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

/* TEXT */

.info{
  position:fixed;
  left:0;
  bottom:11%;
  width:100%;
  text-align:center;
  z-index:5;
  pointer-events:none;
  padding:0 20px;
}

h1{
  margin:0;
  font-size:clamp(34px,9vw,82px);
  font-weight:700;
  letter-spacing:6px;
  text-transform:uppercase;

  background:linear-gradient(
    120deg,
    #ffffff,
    #9b9bb5,
    #ffffff
  );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;

  animation:titleIn 1.8s ease;
}

.role{
  margin-top:14px;
  color:#8d8d9d;
  font-size:12px;
  letter-spacing:5px;
  animation:fadeIn 2.5s ease;
}

.line{
  width:60px;
  height:1px;
  background:#777;
  margin:20px auto;
  opacity:.5;
}

.quote{
  color:#666;
  font-size:11px;
  letter-spacing:2px;
  max-width:500px;
  margin:auto;
}

/* ANIMATIONS */

@keyframes titleIn{

  from{
    opacity:0;
    transform:translateY(35px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

@keyframes fadeIn{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}

/* MOBILE */

@media(max-width:600px){

  .info{
    bottom:9%;
  }

  h1{
    letter-spacing:3px;
  }

  .role{
    letter-spacing:3px;
  }

}

</style>

</head>


<body>


<!-- 3D MODEL -->

<div id="scene"></div>


<!-- TEXT -->

<div class="info">

  <h1>AAKASH KAINTHLA</h1>

  <div class="line"></div>

  <div class="role">
    FILMMAKER • WEB DEVELOPER
  </div>

  <div class="quote">
    Stories • Visuals • Technology
  </div>

</div>


<!-- THREE.JS -->

<script type="module">

import * as THREE from
"https://esm.sh/three@0.180.0";

import { GLTFLoader } from
"https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* SCENE */

const scene =
new THREE.Scene();


/* CAMERA */

const camera =
new THREE.PerspectiveCamera(
  45,
  window.innerWidth /
  window.innerHeight,
  0.1,
  1000
);

camera.position.set(
  0,
  0,
  5
);


/* RENDERER */

const renderer =
new THREE.WebGLRenderer({
  antialias:true,
  alpha:true
});

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.outputColorSpace =
THREE.SRGBColorSpace;

document
.getElementById("scene")
.appendChild(renderer.domElement);


/* LIGHT */

const ambient =
new THREE.AmbientLight(
  0xffffff,
  2
);

scene.add(ambient);


const keyLight =
new THREE.DirectionalLight(
  0xffffff,
  4
);

keyLight.position.set(
  3,
  4,
  5
);

scene.add(keyLight);


const rimLight =
new THREE.PointLight(
  0x7777ff,
  15,
  20
);

rimLight.position.set(
  -3,
  2,
  3
);

scene.add(rimLight);


/* GLB MODEL */

let model = null;

const loader =
new GLTFLoader();


loader.load(

  "model.glb",

  function(gltf){

    model = gltf.scene;

    /* MODEL SIZE */

    const box =
    new THREE.Box3()
    .setFromObject(model);

    const size =
    box.getSize(
      new THREE.Vector3()
    );

    const center =
    box.getCenter(
      new THREE.Vector3()
    );

    model.position.sub(center);


    /* AUTO SCALE */

    const maxSize =
    Math.max(
      size.x,
      size.y,
      size.z
    );

    const scale =
    2.2 / maxSize;

    model.scale.setScalar(scale);


    scene.add(model);

  },

  undefined,

  function(error){

    console.log(
      "GLB ERROR:",
      error
    );

  }

);


/* MOUSE / TOUCH */

let targetX = 0;
let targetY = 0;


window.addEventListener(
  "pointermove",
  function(event){

    targetX =
    (event.clientX /
    window.innerWidth - 0.5)
    * 0.8;

    targetY =
    (event.clientY /
    window.innerHeight - 0.5)
    * 0.4;

  }
);


/* ANIMATION */

const clock =
new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );

  const time =
  clock.getElapsedTime();


  if(model){

    /* ROTATION */

    model.rotation.y +=
    (targetX -
    model.rotation.y)
    * 0.025;


    model.rotation.x +=
    (-targetY -
    model.rotation.x)
    * 0.025;


    /* FLOATING */

    model.position.y =
    Math.sin(time * 1.2)
    * 0.08;

  }


  renderer.render(
    scene,
    camera
  );

}

animate();


/* RESIZE */

window.addEventListener(
  "resize",
  function(){

    camera.aspect =
    window.innerWidth /
    window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>


</body>

</html>
